[project]
name = "energy-dashboard"
version = "0.1.0"
description = "Kardamow energy/macro research dashboard — DuckDB + Parquet lake, Streamlit multipage app."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Riko Kardamow" }]

dependencies = [
    "pandas>=2.2",
    "duckdb>=1.0",
    "plotly>=5.22,<6.0",
    "streamlit>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "pyarrow>=17.0",
    "entsoe-py>=0.8",
    "gridstatus==0.34.0",
    "openpyxl>=3.1",
    "pypdfium2>=4",
    "beautifulsoup4>=4.12",
    "ecmwf-opendata>=0.3",
    "cfgrib>=0.9",
    "xarray>=2024",
    "matplotlib>=3.9",
    "cartopy>=0.24",
    "rapidfuzz>=3.9",
    "fredapi>=0.5",
    "anthropic>=0.40",
    "ib-async>=2.1",
    # Spec 20 Session B's crack VECM. statsmodels carries Johansen/VECM/ADF/KPSS/Granger
    # and ruptures the Bai-Perron break search -- both named explicitly by the spec.
    # statsmodels has no Phillips-Perron test, which is what `arch` is for here; `arch`
    # is also what Spec 22's GARCH-MIDAS-EVT risk engine needs, so it is not a
    # single-use addition. Confirmed with the user before adding (root NOTES.md rule 7).
    # OpenSky Network's official Python binding (Spec 28.04, airspace/aviation). Not
    # published to PyPI, so it installs from the upstream repo's own `python/` subdirectory
    # and is pinned to a commit rather than a tag -- an unpinned git dependency would let a
    # silent upstream change alter behaviour with no lockfile to catch it. v1.4.0 uses the
    # OAuth2 client-credentials flow (client_id/client_secret); the old username/password
    # flow no longer exists.
    "opensky-api @ git+https://github.com/openskynetwork/opensky-api.git@2f7def6609c5d0ec5ace05b034d8bd0d2527b86b#subdirectory=python",
    "statsmodels>=0.15",
    "ruptures>=1.1",
    "arch>=8.0",
    # Spec 29's deterministic sentiment scorer. Chosen over an LLM deliberately: the
    # test story is vcrpy cassettes and 00_TRADING_CONVENTIONS requires a model card
    # for anything estimated, so a reproducible offline scorer is the right trade for
    # a series whose entire purpose is to be compared against a vendor's. VADER is
    # calibrated on general social-media English, not energy jargon -- "crude tanking"
    # is bearish price language, not negative sentiment. Confirmed with the user
    # before adding (root NOTES.md rule 7).
    "vaderSentiment>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "vcrpy>=6.0",
    "pytest-recording>=0.13",
    "pandas-stubs>=2.2",
    # Drives the running Streamlit app in a real browser to verify a page renders --
    # `tests/test_pages_smoke.py` catches exceptions, this catches a page that loads
    # but shows nothing. Needs `playwright install chromium` once after installing.
    "playwright>=1.62",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "pipelines"]

# Required for the pinned opensky-api git dependency above (a direct URL reference in
# [project.dependencies]) -- hatchling refuses to build/install the project editable
# without this. Pre-existing latent breakage surfaced by this session's `uv sync`,
# unrelated to Task 4's own change; fixed here so the shared venv (and the editable
# `energy-dashboard` install every test import depends on) keeps working.
[tool.hatch.metadata]
allow-direct-references = true

# ----------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core", "pipelines", "apps", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"apps/dashboard/pages/*.py" = ["N999"]  # numbered Streamlit page filenames

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
plugins = ["pydantic.mypy"]
exclude = ["data/"]

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
    "duckdb.*",
    "vcr.*",
    "pyarrow.*",
    "gridstatus.*",
    "openpyxl.*",
    "pypdfium2.*",
    "ecmwf.opendata.*",
    "cfgrib.*",
    "cartopy.*",
    "fredapi.*",
    "ib_async.*",
    # Spec 20 Session B's econometrics stack -- none of the three ships type stubs.
    "statsmodels.*",
    "ruptures.*",
    "arch.*",
    "scipy.*",
    "opensky_api.*",
    # Spec 29's VADER scorer -- ships no py.typed marker or stubs.
    "vaderSentiment.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not browser'"
markers = [
    "vcr: mark test to use a vcrpy cassette (pytest-recording)",
    "browser: real-Chromium Streamlit render check (needs `playwright install chromium`; excluded from the default run by addopts -- run explicitly with `pytest -m browser`)",
]
