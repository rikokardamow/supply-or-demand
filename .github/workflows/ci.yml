name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder values only, not real credentials — CI runs entirely off recorded
      # cassettes (see --record-mode=none below), so no live API calls happen and no
      # real secrets are ever needed here. These just satisfy core.settings.Settings'
      # required fields at import time.
      EIA_API_KEY: ci-placeholder
      EMBER_API_KEY: ci-placeholder
      GIE_API_KEY: ci-placeholder
      ENTSOE_API_KEY: ci-placeholder
      FRED_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy core pipelines

      - name: Pytest (cassette playback only, no live calls)
        run: uv run pytest --record-mode=none
