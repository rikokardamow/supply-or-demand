        \     <section id=\"details\">\n        \n<div class=\"gem-c-heading govuk-!-margin-bottom-4\">\n\n
        \ <h2 class=\"gem-c-heading__text govuk-heading-m\">\n    Details\n</h2></div>\n\n
        \       <div data-module=\"govspeak\" class=\"gem-c-govspeak gem-c-govspeak--direction-ltr
        govuk-!-margin-bottom-0\">\n    \n          <div class=\"govspeak\"><h3 id=\"uk-gas-production-trade-and-demand-pdf\">UK
        gas production, trade and demand (PDF)</h3>\n\n<p>An overview of the trends
        in the UK\u2019s gas sector identified for the previous quarter, focusing\_on:\u200B</p>\n\n<ul>\n
        \ <li>natural gas production</li>\n  <li>natural gas trade including imports
        and exports by country of origin and destination</li>\n  <li>natural gas supply
        and demand by broad sectors</li>\n</ul>\n\n<p>We publish this document on
        the last Thursday of each calendar quarter (March, June, September and December).</p>\n\n<h3
        id=\"quarterly-data---et-41\">Quarterly data\u200B - ET 4.1</h3>\n\n<p>This
        data focuses on natural gas supply and demand by broad sectors.\_</p>\n\n<p>We
        publish this quarterly table on the last Thursday of each calendar quarter
        (March, June, September and December). The data is a quarter in arrears.\u200B</p>\n\n<h3
        id=\"monthly-data---et-42-to-et-44\">Monthly data\u200B - ET 4.2 to ET 4.4</h3>\n\n<p>This
        data focuses on natural gas supply (including production) and demand by broad
        sectors. Natural gas trade, including imports and exports by type (i.e. pipeline
        or of liquified natural gas) and country of origin and destination).</p>\n\n<p>We
        publish monthly tables on the last Thursday of every month. The data is 2
        months in arrears.</p>\n\n<h3 id=\"uk-submission-for-jodi---et-45\">UK submission
        for <abbr title=\"Joint Organisations Data Initiative - an international collaboration
        to improve the availability and reliability of data on petroleum and natural
        gas\">JODI</abbr>\u200B - ET 4.5</h3>\n\n<p>International submission of headline
        data for the previous month, published by the last working day of each month.</p>\n\n<h3
        id=\"earlier-data\">Earlier data</h3>\n\n<p>Previous editions of Energy Trends
        are available on the <a href=\"https://www.gov.uk/government/collections/energy-trends\">Energy
        Trends</a> collection page.</p>\n\n<p>You can request previous editions of
        the tables by using the email below in Contact us.</p>\n\n<h3 id=\"contact-us\">Contact
        us\u200B</h3>\n\n<p>If you have questions about these statistics, please email
        <a href=\"mailto:gas.stats@energysecurity.gov.uk\">gas.stats@energysecurity.gov.uk</a>.</p>\n\n</div>\n\n</div>
