      string: "[{\"id\":\"311310\",\"ticker\":\"us-x-iran-ceasefire-before-oil-hits-120\",\"slug\":\"us-x-iran-ceasefire-before-oil-hits-120\",\"title\":\"US
        x Iran ceasefire before Oil hits $120?\",\"description\":\"This market will
        resolve to \u201CYes\u201D if there is an official ceasefire agreement, defined
        as a publicly announced and mutually agreed halt in direct military engagement,
        between the United States and Iran, before Crude Oil (CL) hits \u2191 $120.
        \\n\\nThis market will resolve to \u201CNo\u201D if Crude Oil (CL) hits \u2191
        $120 before there is an official ceasefire agreement, defined as a publicly
        announced and mutually agreed halt in direct military engagement, between
        the United States and Iran. \\n\\nIf there is neither a qualifying ceasefire
        agreement between the United States and Iran nor does Crude Oil (CL) hit \u2191
        $120 by June 30, 2026 (ET), this market will resolve 50-50.\\n\\nIf both events
        occur on the same calendar date, this market will resolve based on which event
        occurred earlier in ET time.\\n\\n1. Crude Oil (CL) hits \u2191 $120\\n\\nThis
        market will resolve to \\\"Yes\\\" if, on any trading day, the official CME
        settlement price for the Active Month (front month) of Crude Oil (CL) futures
        is equal to or above the listed price by the final trading day of June 2026.
        Otherwise, the market will resolve to \\\"No\\\".\\n\\nFor CME Crude Oil (CL)
        futures contracts, the active month is the nearest of the contract months
        listed. The active month becomes a non-active month effective two business
        days prior to the spot month expiration. For example; if the spot month expires
        on a Friday the next listed contract will be considered the Active Month on
        the Wednesday prior to the spot month expiration.\\n\\nOnly the Active Month's
        official settlement price published by CME Group will be considered. Intraday
        trades, highs, lows, bids, offers, midpoint values, or indicative prices do
        not count.\\n\\nNote that the settlement price may differ from the last traded
        price. CME's methodology to determine the settlement price can vary by commodity
        and contract.\\n\\nOnly days on which CME publishes an official settlement
        price for the Active Month will be included. Days without settlement prices
        (weekends, holidays, or market closures) are ignored.\\n\\nThis market will
        resolve based on the settlement price as it appears on the CME settlement
        page at the time it is first published for that trading day, regardless of
        any later corrections or updates.\\n\\nThe resolution source is the CME Group
        website \u2014 specifically, the daily \\\"Settlement\\\" price for the Active
        Month of Crude Oil (CL) futures.\\n\\n2. US x Iran ceasefire\\n\\nFor the
        purposes of this market, an \u201Cofficial ceasefire agreement\u201D requires
        clear public confirmation from both the United States government and the government
        of Iran that they have agreed to halt military hostilities against one another,
        or for an official ceasefire agreement to be otherwise confirmed to have been
        reached by an overwhelming consensus of media reporting.\\n\\nIf the agreement
        is officially reached before Trump visits China, this market will resolve
        to \u201CYes,\u201D regardless of whether or when the ceasefire officially
        takes effect.\\n\\nAny form of informal understanding, backchannel communication,
        de-escalation without an announced agreement, or unilateral pause in hostilities
        will not be considered an official ceasefire. Humanitarian pauses, limited
        operational pauses, or temporary tactical stand-downs will not count toward
        the resolution of this market.\\n\\nA broader peace deal, normalization agreement,
        or political framework will qualify only if it includes a publicly announced
        and mutually agreed halt in military engagement between the United States
        and Iran, effective on a specified date, or otherwise confirmed by an overwhelming
        consensus of credible reporting. Agreements that outline future negotiations
        or de-escalation measures without an explicit, dated commitment to stop fighting
        will not qualify.\\n\\nThe primary resolution source for whether a qualifying
        ceasefire agreement has been reached will be  official statements from the
        United States government and the government of Iran. However, an overwhelming
        consensus of credible media reporting confirming that an official ceasefire
        agreement has been reached will suffice.\",\"resolutionSource\":\"\",\"startDate\":\"2026-03-26T20:50:38.938582Z\",\"creationDate\":\"2026-03-26T20:50:38.938576Z\",\"endDate\":\"2026-06-30T00:00:00Z\",\"image\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/us-x-iran-ceasefire-before-oil-hits-120-zS2us0Vso1Ou.jpg\",\"icon\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/us-x-iran-ceasefire-before-oil-hits-120-zS2us0Vso1Ou.jpg\",\"active\":true,\"closed\":true,\"archived\":false,\"new\":false,\"featured\":false,\"restricted\":true,\"volume\":283336.22909600026,\"openInterest\":93084.660888,\"createdAt\":\"2026-03-26T20:45:03.621889Z\",\"updatedAt\":\"2026-08-13T02:51:44.021729Z\",\"enableOrderBook\":true,\"commentCount\":15,\"markets\":[{\"id\":\"1734822\",\"question\":\"US
