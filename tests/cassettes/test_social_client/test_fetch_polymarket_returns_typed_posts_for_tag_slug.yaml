        of talks and US strike warnings had spiked oil earlier in March, yet de-escalation
        via this agreement\u2014confirmed by White House statements and celebrated
        regionally\u2014precedes any further surge. While implementation risks or
        breakdowns could prompt volatility, late verification of oil data or disputes
