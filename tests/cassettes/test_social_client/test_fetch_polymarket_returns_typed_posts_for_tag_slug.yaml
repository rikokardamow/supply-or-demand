        there be a power grid emergency before October 1?\",\"description\":\"This
        event tracks whether each listed U.S. regional grid operator declares a NERC
        Energy Emergency Alert at Level 2 (EEA-2) or Level 3 (EEA-3) from this event's
        creation through that market's deadline of 11:59 PM local time on September
        30, 2026. Each regional market resolves independently to \\\"Yes\\\" or \\\"No\\\"
        under its own operator, sources, and rules shown on that market, and more
        than one market may resolve \\\"Yes\\\".\\n\\nEach market is confirmed by
        any official communication from the relevant grid operator \u2014 its newsroom
        or press releases (linked in that market's rules), market or grid notices,
        or real-time system-status postings \u2014 or by credible national news reporting.
        A lower EEA-1 declaration does not qualify in any market. A declaration qualifies
        as long as it happened before the deadline, even if it is only documented
        or reported afterward. A DOE Section 202(c) emergency order is not a NERC
        EEA declaration and does not qualify in any market. Because Energy Emergency
        Alerts are federally reportable, a qualifying declaration is also verifiable
        through mandatory NERC or U.S. Department of Energy records (DOE Form OE-417,
        published at https://www.oe.netl.doe.gov/oe417.aspx) even if no other source
        captures it.\",\"resolutionSource\":\"\",\"startDate\":\"2026-08-12T21:26:05Z\",\"creationDate\":\"2026-08-12T21:27:28.660855Z\",\"endDate\":\"2026-10-02T06:59:00Z\",\"image\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/will-phoenix-be-under-an-extreme-heat-warning-for-10-days-in-august-2026-2026072-mFaXtLdrzngM.png\",\"icon\":\"https://polymarket-upload.s3.us-east-2.amazonaws.com/will-phoenix-be-under-an-extreme-heat-warning-for-10-days-in-august-2026-2026072-mFaXtLdrzngM.png\",\"active\":true,\"closed\":false,\"archived\":false,\"new\":false,\"featured\":false,\"restricted\":true,\"liquidity\":6645.6334,\"volume\":13330.289888999998,\"openInterest\":2705.8731,\"sortBy\":\"ascending\",\"createdAt\":\"2026-08-12T21:25:44.882501Z\",\"updatedAt\":\"2026-09-06T09:22:43.580525Z\",\"competitive\":0.9097318565352862,\"volume24hr\":166.4,\"volume1wk\":2763.868241,\"volume1mo\":2924.648241,\"volume1yr\":2924.648241,\"enableOrderBook\":true,\"liquidityClob\":6645.6334,\"negRisk\":false,\"commentCount\":0,\"markets\":[{\"id\":\"3552739\",\"question\":\"Will
